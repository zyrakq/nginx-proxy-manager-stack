  location / {
    resolver 8.8.8.8 ipv6=off valid=30s;
    
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k; 

    proxy_pass $forward_scheme://$server;
    proxy_ssl_server_name on;
    proxy_ssl_name $server;
    
    proxy_ssl_verify off;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
  
    proxy_set_header Host $server;
    proxy_set_header Accept-Encoding ""; 

    proxy_redirect $forward_scheme://$server/ $scheme://$host/;

    proxy_cookie_domain $server $host;

    sub_filter_types text/html text/css text/xml application/javascript;
    sub_filter '$forward_scheme://$server' '$scheme://$host';
    sub_filter_once off;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header Content-Security-Policy-Report-Only;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-XSS-Protection;
  }